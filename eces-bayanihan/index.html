  async function refresh() {
    if (shared) return session(await api('state'));

  }
  async function run(action, payload, requestId = random()) {
    if (shared) {
      const res = await api('action', {
        action,
        payload,
        requestId
      });
      session(res);
      return res.id;
    }
    if (!handle) {
      const result = E.transition(current, actorId, action, payload, requestId, {
        device: device()
      });
      current = result.db;
      return result.id;
    }
    const tx = handle.transaction('state', 'readwrite'),
      finished = done(tx),
      store = tx.objectStore('state');
    try {
      const base = await request(store.get('school'));
      const res = E.transition(base, actorId, action, payload, requestId, {
        device: device()
      });
      store.put(res.db, 'school');
      await finished;
      current = res.db;
      broadcast();
      return res.id;
    } catch (e) {
      try {
        tx.abort();
      } catch (_) {}
      await finished.catch(() => {});
      throw e;
    }
  }
  async function digest(pass, salt) {
    if (!crypto.subtle) throw Error('Open the downloaded demo in Chrome or Edge, or use localhost, to create a practice password.');
    const enc = new TextEncoder();
    const raw = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
    const hash = await crypto.subtle.deriveBits({
      name: 'PBKDF2',
      salt: enc.encode(salt),
      iterations: 180000,
      hash: 'SHA-256'

  function password(p) {
    if (typeof p !== 'string' || p.length < 10 || p.length > 128) throw Error('Use a practice password of 10–128 characters.');
  }

    password(v.password);
    if (shared) {
      session(await api('register', v));
      return;
    }
    const salt = random(),
      hash = await digest(v.password, salt);
    if (!handle) {
      const result = E.transition(current, 'parent', 'register', v, '', {
        device: device()
      });
      memoryPins.set(result.id, {
        salt,
        hash
      });
      current = result.db;
      actorId = result.id;
      rememberSample();
      rememberAccount(actorId);
      return;
    }
    const tx = handle.transaction(['state', 'pins'], 'readwrite'),
      finished = done(tx);
    try {
      const store = tx.objectStore('state');
      const base = await request(store.get('school'));
      const res = E.transition(base, 'parent', 'register', v, '', {
        device: device()
      });
      store.put(res.db, 'school');
      tx.objectStore('pins').put({
        salt,
        hash
      }, res.id);
      await finished;
      current = res.db;
      actorId = res.id;
      rememberSample();
      rememberAccount(actorId);
      broadcast();
    } catch (e) {
      try {
        tx.abort();
      } catch (_) {}
      await finished.catch(() => {});
      throw e;
    }
  }
  async function login(v) {
    if (shared) {
      session(await api('login', v));
      return;
    }
    await refresh();
    const a = current.accounts.find(x => !x.demo && x.active && x.login === E.loginKey(v.login));
    const record = a && (handle ? await request(handle.transaction('pins').objectStore('pins').get(a.id)) : memoryPins.get(a.id));
    if (!record || (await digest(v.password, record.salt)) !== record.hash) throw Error('The mobile number or password is incorrect.');
    actorId = a.id;
    rememberSample();
    rememberAccount(a.id);

    if (!handle) E.seenOn(current, a.id, device());else {
      const tx = handle.transaction('state', 'readwrite'),
        finished = done(tx),
        store = tx.objectStore('state');
      const base = await request(store.get('school'));

      await finished;
      current = base;
    }
  }
  // One practice profile per role. The other fictional presidents stay on the board roster.
  const practiceProfiles = ['parent', 'bod-1', 'head', 'chair', 'vice', 'secretary', 'treasurer', 'collector'];
  // Practice only: each remaining fictional attendee casts a ballot through the ordinary vote rule.
  async function practiceBallots(id) {
    if (shared) throw Error('Practice ballots are unavailable in the shared rehearsal.');
    const fill = base => {
      if (!E.isChair(base, E.account(base, actorId))) throw Error('The chairperson adds practice ballots.');
      const b = base.ballots.find(x => x.id === id && x.status === 'open');
      if (!b) throw Error('This ballot is closed.');
      let db = base;
      b.present.filter(m => !b.participated.includes(m) && !practiceProfiles.includes(m) && E.account(base, m)?.demo).forEach((m, i) => {
        if (db.ballots.find(x => x.id === id).status !== 'open') return;
        db = E.transition(db, m, 'vote', {
          id,
          vote: i % 6 === 4 ? 'no' : i % 9 === 7 ? 'abstain' : 'yes'
        }).db;
      });
      return db;
    };
    if (!handle) {
      current = fill(current);
      return;
    }
    const tx = handle.transaction('state', 'readwrite'),
      finished = done(tx),
      store = tx.objectStore('state');
    try {
      const next = fill(await request(store.get('school')));
      store.put(next, 'school');
      await finished;
      current = next;
      broadcast();
    } catch (e) {
      try {
        tx.abort();
      } catch (_) {}
      await finished.catch(() => {});
      throw e;
    }
  }
  async function logout() {

      session(await api('logout', {}));
      return;
    }
    actorId = '';
    rememberSample();
    rememberAccount();
  }
  function sample(id) {
    if (shared || !E.account(current, id)?.demo || !E.account(current, id)?.active) throw Error('Choose an available sample profile.');
    actorId = id;
    rememberSample(id);
  }
  async function fileMeta(f) {
    if (!f || !f.size) throw Error('Choose a supporting image or PDF.');
    const meta = E.photo({
      key: random(),
      name: f.name,
      type: f.type,
      size: f.size
    });
    const s = new Uint8Array(await f.slice(0, 12).arrayBuffer());
    const starts = bytes => bytes.every((b, i) => s[i] === b);
    const valid = meta.type === 'image/jpeg' ? starts([255, 216, 255]) : meta.type === 'image/png' ? starts([137, 80, 78, 71, 13, 10, 26, 10]) : meta.type === 'application/pdf' ? starts([37, 80, 68, 70, 45]) : starts([82, 73, 70, 70]) && String.fromCharCode(...s.slice(8, 12)) === 'WEBP';
    if (!valid) throw Error('The file contents do not match its type.');
    if (shared) {
      const res = await fetch('/api/files', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
          'Content-Type': meta.type,
          'X-Filename': encodeURIComponent(meta.name)
        },
        body: f
      });
      const data = await res.json();
      if (!res.ok) throw Error(data.error);
      return data;
    }
    if (!handle) {
      memoryFiles.set(meta.key, f);
      return meta;
    }
    const tx = handle.transaction('files', 'readwrite'),
      finished = done(tx);
    tx.objectStore('files').put(f, meta.key);
    await finished;
    return meta;
  }
  async function fileURL(meta) {
    if (shared) {
      const r = await fetch('/api/files/' + encodeURIComponent(meta.key), {
        cache: 'no-store'
      });
      if (!r.ok) throw Error('Access to this attachment is unavailable.');
      return URL.createObjectURL(await r.blob());
    }
    if (meta.key === 'sample-sheet') {
      const sample = document.getElementById('embedded-school-example');
      if (!sample) return 'assets/sample-collection-sheet.pdf';
      const bytes = Uint8Array.from(atob(sample.textContent.trim()), c => c.charCodeAt(0));
      return URL.createObjectURL(new Blob([bytes], {
        type: 'application/pdf'
      }));
    }
    const f = handle ? await request(handle.transaction('files').objectStore('files').get(meta.key)) : memoryFiles.get(meta.key);
    if (!f) throw Error('The original file is unavailable. Return the record for correction.');
    return URL.createObjectURL(f);
  }
  async function printRecord(id) {
    if (shared) return api('resolutions/' + encodeURIComponent(id) + '/print');
    const record = current.resolutions.find(r => r.id === id && r.state !== 'draft');
    if (!record || !E.printers.includes(E.account(current, actorId)?.role)) throw Error('Printing this version is restricted.');
    return record;
  }
  async function reset() {
    if (shared) throw Error('Demo reset is unavailable in shared mode.');
    if (!handle) {
      memoryFiles.clear();
      memoryPins.clear();
      current = E.create();
      actorId = '';
      rememberSample();
      return;
    }
    const tx = handle.transaction(['state', 'pins', 'files'], 'readwrite'),
      finished = done(tx);
    const db = E.create();
    tx.objectStore('state').put(db, 'school');
    tx.objectStore('pins').clear();
    tx.objectStore('files').clear();
    await finished;
    current = db;
    actorId = '';
    rememberSample();
    broadcast();
  }
  root.ECESStore = {
    init,
    refresh,
    run,
    register,
    login,
    logout,
    sample,
    practiceProfiles,
    practiceBallots,
    fileMeta,
    fileURL,
    printRecord,
    reset,
    random,
    notice,
    get sessionOnly() {
      return !shared && !handle;
    },
    get db() {
      return current;
    },
    get me() {
      return actorId;
    },
    get device() {
      return device();
    },
    get shared() {
      return shared;
    }
  };
})(globalThis);

<script>
(function (root) {
  'use strict';

  // Document reader for the treasurer's scan-and-check flow.
  //
  // PROTOTYPE: this file is a practice reader. It returns fictional readings so the
  // review-and-submit flow can be rehearsed. It does not read handwriting.
  // A pilot replaces read() with a school-approved reading service (see ROADMAP.md).
  // Every reading must keep this shape, and a reading never posts by itself:
  // the treasurer checks each line, then the chairperson reviews the original.
  //
  // reading = {
  //   engine, direction: 'in' | 'out', date: 'YYYY-MM-DD', receipt, purpose,
  //   items: [{ description, cents, check? }],   check = why a line needs a closer look
  //   writtenTotal: cents written on the paper, or null
  //   matchesImage: false when the values did not come from the chosen photo
  // }
  const samples = {
    collection: {
      label: 'Sample collection sheet',
      filename: 'sample-collection-sheet.png',
      prefix: 'DEMO-COL',
      heading: 'SPTA Collection Sheet',
      direction: 'in',
      purpose: 'Voluntary SPTA contributions',
      items: [
        ['Grade 1 · Sampaguita', 85000],
        ['Grade 2 · Rosal', 120000],
        ['Grade 3 · Camia', 95000],
        ['Grade 4 · Dahlia', 110000],
        ['Grade 5 · Ilang-Ilang', 70000, 'The handwriting is unclear here. Check this amount.'],
        ['Grade 6 · Adelfa', 130000]
      ]
    },
    receipt: {
      label: 'Sample expense receipt',
      filename: 'sample-expense-receipt.png',
      prefix: 'DEMO-OR',
      heading: 'Official Receipt · Sample School Supplies',
      direction: 'out',
      purpose: 'Reading corner materials',
      items: [
        ['Storybooks, 12 pieces', 240000],
        ['Low bookshelf', 150000],
        ['Floor mats, 3 pieces', 60000, 'The amount is faint on the paper. Check this amount.']
      ]
    }
  };
  const allowed = ['image/jpeg', 'image/png', 'image/webp', 'application/pdf'];
  const known = new WeakMap();
  const peso = cents => '₱' + (cents / 100).toLocaleString('en-PH', {
    minimumFractionDigits: 2
  });
  function freeReference(prefix, used = []) {
    const taken = new Set(used.map(x => String(x).toLowerCase()));
    for (let n = 1; n < 1000; n++) {
      const ref = prefix + '-' + String(n).padStart(3, '0');
      if (!taken.has(ref.toLowerCase())) return ref;
    }
    return prefix + '-' + Date.now();
  }
  function practiceReading(key, options = {}) {
    const s = samples[key];
    if (!s) throw Error('Choose an available sample.');
    const items = s.items.map(([description, cents, check]) => check ? {
      description,
      cents,
      check
    } : {
      description,
      cents
    });
    return {
      engine: 'practice',
      sample: key,
      heading: s.heading,
      direction: s.direction,
      date: options.today || new Date().toISOString().slice(0, 10),
      receipt: freeReference(s.prefix, options.usedReferences),
      purpose: s.purpose,
      items,
      writtenTotal: items.reduce((sum, x) => sum + x.cents, 0),
      matchesImage: true
    };
  }

  // Draws the fictional paper so the photo on screen matches the values that are filled in.
  function drawSheet(canvas, reading) {
    const w = canvas.width = 900,
      h = canvas.height = 1180,
      c = canvas.getContext('2d');
    const hand = '"Segoe Print","Bradley Hand","Marker Felt","Comic Sans MS",cursive';
    c.fillStyle = '#fbf8ef';
    c.fillRect(0, 0, w, h);
    c.strokeStyle = '#cfdcec';
    c.lineWidth = 2;
    for (let y = 300; y < h - 60; y += 72) {
      c.beginPath();
      c.moveTo(50, y);
      c.lineTo(w - 50, y);
      c.stroke();
    }
    c.strokeStyle = '#e7b5b5';
    c.beginPath();
    c.moveTo(610, 230);
    c.lineTo(610, h - 60);
    c.stroke();
    c.fillStyle = '#102b59';
    c.font = '700 36px Georgia,serif';
    c.fillText(reading.heading, 50, 86);
    c.font = '24px Georgia,serif';
    c.fillStyle = '#3d5273';
    c.fillText('East Central Elementary School · Fictional practice copy', 50, 126);
    c.fillStyle = '#1b2f6b';
    c.font = '30px ' + hand;
    c.fillText('Ref: ' + reading.receipt, 50, 190);
    c.fillText('Date: ' + reading.date, 520, 190);
    c.fillText('For: ' + reading.purpose, 50, 244);
    let y = 350;
    reading.items.forEach(x => {
      c.font = '32px ' + hand;
      c.fillText(x.description, 60, y);
      c.fillText((x.cents / 100).toLocaleString('en-PH', {
        minimumFractionDigits: 2
      }), 640, y);
      y += 72;
    });
    y += 30;
    c.font = '700 34px ' + hand;
    c.fillText('TOTAL', 60, y);
    c.fillText(peso(reading.writtenTotal), 620, y);
    c.strokeStyle = '#1b2f6b';
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(610, y + 14);
    c.lineTo(w - 60, y + 14);
    c.stroke();
    c.font = '22px Georgia,serif';
    c.fillStyle = '#7b8798';
    c.fillText('No family or pupil details. For rehearsal only.', 50, h - 28);
  }
  async function sampleFile(key, options = {}) {
    const reading = practiceReading(key, options);
    const canvas = root.document.createElement('canvas');
    drawSheet(canvas, reading);
    const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(Error('This browser could not prepare the sample sheet.')), 'image/png'));
    const file = new File([blob], samples[key].filename, {
      type: 'image/png'
    });
    known.set(file, reading);
    return file;
  }

    if (!file || !file.size) throw Error('Choose a photo or PDF of the sheet.');

    if (file.size > 8 * 1024 * 1024) throw Error('Each file must be 8 MB or smaller.');

    engine: 'practice',
    samples,
    allowed,
    freeReference,
    practiceReading,
    sampleFile,
    read
  };

  else root.ECESScan = api;
})(globalThis);

</script>

  // Headings and sub-headings use title case. A word that already has a capital (SPTA, iPad) is left alone.
  function titleCase(text) {
    const parts = String(text ?? '').split(/(\s+|-)/);
    const wordAt = parts.map((x, i) => /[A-Za-z\u00C0-\u024F]/.test(x) ? i : -1).filter(i => i >= 0);
    return parts.map((word, i) => {
      const m = word.match(/^([^A-Za-z\u00C0-\u024F]*)(.*)$/);
      if (!m[2] || m[2] !== m[2].toLowerCase()) return word;
      const edge = i === wordAt[0] || i === wordAt.at(-1) || parts[i - 1] === '-' && parts[i + 1] !== '-';
      // "Sign in" and "sign up" are verbs, so the second word takes a capital.
      const verb = /^(sign|log)$/i.test(parts[i - 2] || '');
      if (!edge && !verb && smallWords.has(m[2].replace(/[^a-z]+$/, ''))) return word;

  // Signature pad: the officer's own strokes become short line paths in a 300 by 100 box.
  let pen = null;
  function penPoint(ev, pad) {
    const box = pad.getBoundingClientRect();
    return [Math.max(0, Math.min(300, Math.round((ev.clientX - box.left) / box.width * 300))), Math.max(0, Math.min(100, Math.round((ev.clientY - box.top) / box.height * 100)))];
  }
  function drawPad(pad, strokes) {
    const c = pad.getContext('2d');
    c.clearRect(0, 0, pad.width, pad.height);
    c.lineWidth = 4;
    c.lineCap = c.lineJoin = 'round';
    c.strokeStyle = '#102b59';
    strokes.forEach(line => {
      c.beginPath();
      line.forEach(([x, y], i) => c[i ? 'lineTo' : 'moveTo'](x * 2, y * 2));
      c.stroke();
    });
    const field = pad.parentNode.querySelector('[name=signature]');
    const kept = strokes.filter(line => line.length > 1);
    field.value = kept.map(line => line.map(([x, y], i) => (i ? 'L' : 'M') + x + ' ' + y).join(' ')).join(' ');
  }

    const box = ev.target.name === 'budget' && document.getElementById('screen-fund');
    if (box) {
      const short = Math.round((Number(ev.target.value) || 0) * 100) - Number(box.dataset.available);
      box.className = 'fund-check ' + (short > 0 ? 'short' : 'ok');
      document.getElementById('screen-fund-note').textContent = short > 0 ? 'Needs fundraising · short by ' + cash(short) + '.' : 'Covered by available SPTA funds.';
    }
  });
  document.addEventListener('change', ev => {
    if (ev.target.id === 'scan-file') {
      const file = ev.target.files?.[0];
      if (file) startScan(file).catch(e => showMessage(e.message));
      return;
    }
    if (ev.target.id === 'practice-profile') {
      try {
        if (ev.target.value === 'guest') S.logout();else S.sample(ev.target.value);
        ui.tab = 'home';
        ui.reviewed.clear();
        ui.printId = null;
        ui.message = '';
        render();
      } catch (e) {
        showMessage(e.message);
      }
      return;
    }
    if (ev.target.closest('form')) updateConditions(ev.target.closest('form'));
  });
  document.addEventListener('submit', async ev => {
    const f = ev.target.closest('form[data-form]');
    if (!f) return;
    ev.preventDefault();
    if (ui.busy) return;
    ui.busy = true;
    const submitButton = f.querySelector('[type="submit"]');
    submitButton.disabled = true;
    const action = f.dataset.form,
      data = new FormData(f),
      payload = {};
    data.forEach((val, key) => {
      if (typeof val === 'string') payload[key] = val;
    });
    f.querySelectorAll('input[type=checkbox]:not([disabled])').forEach(box => {
      if (!['present', 'requiredSigners'].includes(box.name)) payload[box.name] = box.checked;
    });
    payload.id = f.dataset.id;
    let token = f.dataset.token;
    if (!token) {
      token = S.random();
      f.dataset.token = token;
    }
    try {
      if (action === 'login' || action === 'register') {
        if (action === 'register') {
          payload.role = payload.officer ? 'bod' : 'parent';
          delete payload.officer;
        }
        await S[action](payload);
        ui.tab = action === 'register' ? 'account' : 'home';
        cleanScan();
        ui.dialog = null;
        ui.reviewed.clear();
        ui.message = success[action];
        render();
        return;
      }
      if (action === 'acting') payload.enabled = payload.enabled === 'yes';
      if (action === 'freeze' && payload.signerRule === 'policy') payload.requiredSigners = data.getAll('requiredSigners');
      if (action === 'financeSubmit') {
        const descriptions = data.getAll('itemDescription'),
          amounts = data.getAll('itemAmount');
        payload.items = descriptions.map((description, i) => ({
          description,
          amount: amounts[i]
        }));
        delete payload.itemDescription;
        delete payload.itemAmount;
        if (payload.direction === 'in') payload.project = '';
      }
      if (action === 'sign' && payload.response === 'acknowledged' && !payload.signature) throw Error('Draw your signature in the box first.');
      if (action === 'financeReview') {
        const batch = db().batches.find(x => x.id === payload.id);
        payload.stamp = E.openStamp(batch);
        if (payload.decision === 'post' && !ui.reviewed.has(S.me + '|' + payload.stamp)) throw Error('Open the supporting original before approving this post.');
      }
      const file = data.get('attachment');
      if (file?.size) payload.file = await S.fileMeta(file);else if (action === 'financeSubmit' && ui.scan?.stage === 'done') payload.file = ui.scan.meta ||= await S.fileMeta(ui.scan.file);
      if (['submitProposal', 'caseSubmit', 'resubmit'].includes(action)) ui.tab = 'updates';
      if (action === 'headDecision' && payload.decision === 'approve') ui.tab = 'projects';
      await change(action, payload, token);
    } catch (e) {
      showMessage(e.message);
    } finally {
      ui.busy = false;
      submitButton.disabled = false;
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ui.dialog && !ui.busy) closeDialog();
    if (e.key === 'Tab' && ui.dialog) {
      const all = [...document.querySelectorAll('.portal-modal button,.portal-modal input,.portal-modal select,.portal-modal textarea,.portal-modal a')].filter(x => !x.disabled && x.offsetParent !== null);
      if (!all.length) return;
      const edge = e.shiftKey ? all[0] : all.at(-1);
      if (document.activeElement === edge) {
        e.preventDefault();
        (e.shiftKey ? all.at(-1) : all[0]).focus();
      }
    }
  });
  window.addEventListener('afterprint', () => {
    ui.printId = null;
    ui.printRecord = null;
    render();
  });
  async function refresh() {
    if (ui.busy || ui.dialog || !S.db) return;
    try {
      const rev = db().revision;
      await S.refresh();
      if (rev !== db()?.revision || !me()) render();
    } catch (e) {
      showMessage(e.message);
    }
  }
  S.notice.addEventListener('message', refresh);
  window.addEventListener('focus', refresh);
  window.addEventListener('online', refresh);
  window.addEventListener('offline', () => showMessage(S.shared ? 'Connection lost. Keep this page open and retry when connected.' : 'Your fictional rehearsal is stored on this device.'));
  S.init().then(() => {
    if (!S.shared && oldView) {
      const route = {
        head: ['head', 'insights'],
        spta: ['chair', 'proposals'],
        bod: ['bod-1', 'board'],
        treasurer: ['treasurer', 'finance'],
        parent: ['parent', 'home'],
        automation: ['head', 'cases']
      }[oldView];
      if (route) {
        S.sample(route[0]);
        ui.tab = route[1];
      }
    }
    render();
    if (S.shared) setInterval(() => {
      if (!document.hidden) refresh();
    }, 15000);
  }).catch(e => {
    document.getElementById('app').innerHTML = '<main class="login-shell"><h1>Open ECES Bayanihan</h1>' + para('The rehearsal could not open its local storage. Use localhost and allow this site to save data, or start the shared rehearsal server.') + para(e.message) + '</main>';
  });
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
